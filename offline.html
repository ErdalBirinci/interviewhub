<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f8cff" />
    <title>InterviewHub — Bağlantı yok</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0b0f1a;
        color: #e6ecf7;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      .card { max-width: 380px; }
      .logo {
        width: 72px; height: 72px;
        border-radius: 18px;
        background: linear-gradient(135deg, #4f8cff, #7c3aed);
        display: grid; place-items: center;
        font-size: 1.75rem; font-weight: 800;
        margin: 0 auto 1.25rem;
      }
      h1 { font-size: 1.35rem; margin-bottom: 0.5rem; }
      p { color: #8b96ad; line-height: 1.6; margin-bottom: 1.5rem; }
      button {
        background: #4f8cff; color: #fff; border: 0;
        padding: 0.75rem 1.5rem; border-radius: 10px;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #6b9fff; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">IH</div>
      <h1>Bağlantı yok</h1>
      <p>İnternet bağlantınız kesilmiş görünüyor. Lütfen bağlantınızı kontrol edip yenileyin.</p>
      <button onclick="location.reload()">Yenile</button>
    </div>
  </body>
</html>
